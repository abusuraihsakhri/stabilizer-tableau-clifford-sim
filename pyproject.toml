[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stabilizer-tableau-clifford-sim"
version = "2.0.0"
description = "Aaronson-Gottesman Stabilizer Tableau Fast Clifford Simulator"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
stabilizer-tableau-clifford-sim = "stabilizer_tableau.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/stabilizer-tableau-clifford-sim"
Repository = "https://github.com/abusuraihsakhri/stabilizer-tableau-clifford-sim.git"

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.23,<1", "pydantic>=2,<3"]
test = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
include = ["agents*", "stabilizer_tableau*"]
