name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pydantic>=2,<3" "fastapi>=0.110,<1" uvicorn pytest
      - name: Compile packages
        run: python -m compileall -q agents stabilizer_tableau
      - name: Run Python regression suite
        run: python -m pytest -q
      - name: Verify HMAC audit chain
        run: |
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check web/simulator.mjs && node --check web/app.mjs
      - name: Run browser simulation tests
        run: node --test tests/test_browser.mjs
