version: '3.8'

services:
  stabilizer-tableau-clifford-sim:
    build: .
    container_name: stabilizer-tableau-clifford-sim
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=stabilizer-tableau-clifford-sim-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
